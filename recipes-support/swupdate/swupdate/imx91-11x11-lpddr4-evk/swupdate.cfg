globals :
{
	verbose			= true;
	loglevel		= 5;
	syslog			= true;
	public-key-file = "@PUBKEY@";
};

download :
{
	retries			= 3;
	timeout			= 1800;
};

suricatta :
{
	enable			= false;
	tenant			= "default";
	id				= "@TARGETID@";
	confirm			= 0;
	url 			= "@PROTOCOL@://@HOSTNAME@:@PORT@";
	polldelay		= 360;
	nocheckcert		= true;
	retry			= 4;
	retrywait		= 200;
	loglevel		= 10;
	userid			= 0;
	groupid			= 0;
	targettoken		= "@TARGETTOKEN@";
/*
	max_artifacts	= 1;
	cafile			= "/etc/ssl/cafile";
	sslkey			= "/etc/ssl/sslkey";
	sslcert			= "/etc/ssl/sslcert";
*/
};

webserver :
{
	document_root	= "/www";
	port			= "8080";
	userid			= 0;
	groupid			= 0;
	timeout			= 20;
};
