# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "swupdate-boards-imx"
BBFILE_PATTERN_swupdate-boards-imx = "^${LAYERDIR}/"
BBFILE_PRIORITY_swupdate-boards-imx = "9"

LAYERDEPENDS_swupdate-boards-imx = "swupdate"

# UNPACKDIR is used throughout the layer, which requires walnascar or newer.
LAYERSERIES_COMPAT_swupdate-boards-imx = "walnascar"

BBFILES_DYNAMIC += " \
	fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx/*/*/*.bb \
	fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx/*/*/*.bbappend \
"
